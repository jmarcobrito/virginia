services:
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: virginia-evolution
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#0F6E8C
      - LOG_LEVEL=ERROR
      - DATABASE_ENABLED=false
      - CACHE_REDIS_ENABLED=false
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - virginia-net
    restart: always

  n8n:
    image: n8nio/n8n:latest
    container_name: virginia-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - N8N_BASIC_AUTH_ACTIVE=false
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_LOG_LEVEL=warn
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      # Variáveis do projeto — preencher em .env
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - VIRGINIA_BACKEND_URL=${VIRGINIA_BACKEND_URL:-http://host.docker.internal:8000}
      - VIRGINIA_WEBHOOK_SECRET=${VIRGINIA_WEBHOOK_SECRET}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - ALERT_PHONE_NUMBER=${ALERT_PHONE_NUMBER}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/workflows:ro
    networks:
      - virginia-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - evolution-api
    restart: always

networks:
  virginia-net:
    driver: bridge

volumes:
  evolution_data:
  n8n_data:
